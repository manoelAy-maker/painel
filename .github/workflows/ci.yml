name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # O package-lock legado ainda não contém todas as dependências Capacitor do package.json.
      # Até ele ser regenerado de forma confiável, validamos o código pelo package.json sem sobrescrever o lock no repositório.
      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

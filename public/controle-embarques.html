<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Painel Ayres - Controle de Embarques PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&family=Inter:wght@400;600&display=swap');
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f3f4f6; color: #1f2937; }
        .spreadsheet-table { border-collapse: collapse; width: 100%; background: white; font-size: 13px; }
        .spreadsheet-table th { background: #e5e7eb; color: #374151; font-weight: 600; border: 1px solid #d1d5db; padding: 8px 12px; text-align: left; position: sticky; top: 0; z-index: 10; }
        .spreadsheet-table td { border: 1px solid #e5e7eb; padding: 6px 12px; white-space: nowrap; }
        .spreadsheet-table tr:hover { background: #f9fafb; }
        .spreadsheet-table tr.selected { background: #eff6ff; }
        .kpi-box { background: white; border: 1px solid #d1d5db; padding: 12px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        #mainMap { height: 400px; border: 1px solid #d1d5db; border-radius: 4px; }
        #miniMap { height: 200px; border: 1px solid #d1d5db; border-radius: 4px; margin-top: 8px; cursor: crosshair; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .status-badge { padding: 2px 8px; border-radius: 3px; font-weight: 600; font-size: 11px; text-transform: uppercase; border: 1px solid transparent; }
        .status-embarcando { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
        .status-programado { background: #fef9c3; color: #854d0e; border-color: #fef08a; }
        .status-finalizado { background: #f3f4f6; color: #374151; border-color: #d1d5db; }
        .btn-excel { background: #1d6f42; color: white; padding: 6px 12px; border-radius: 4px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .btn-excel:hover { background: #155231; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="bg-white border-b border-gray-300 px-4 py-2 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-4">
            <h1 class="text-lg font-bold text-gray-700 flex items-center gap-2">
                <span class="text-green-700">🚛</span> Painel Ayres PRO
            </h1>
            <div class="h-6 w-px bg-gray-300"></div>
            <span class="text-sm text-gray-500 italic">Controle de Localização Ativo</span>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="exportData()" class="text-xs text-blue-600 hover:underline">📥 Backup</button>
            <span class="text-sm font-semibold text-gray-600">👤 Manoel Ayres</span>
        </div>
    </header>

    <div class="bg-gray-100 border-b border-gray-300 px-4 py-2 flex flex-wrap gap-3 items-center">
        <div class="flex items-center gap-2 bg-white border border-gray-300 rounded px-2 py-1">
            <span class="text-gray-400 text-sm">🔍</span>
            <input type="text" id="searchInput" oninput="renderTable()" placeholder="Pesquisar..." class="outline-none text-sm w-64">
        </div>
        <button onclick="toggleMap()" class="bg-white border border-gray-300 hover:bg-gray-50 px-3 py-1 rounded text-sm flex items-center gap-2">
            📍 Ver Mapa Geral
        </button>
        <div class="flex-grow"></div>
        <button onclick="openModal()" class="btn-excel">+ Novo Embarque</button>
    </div>

    <main class="flex-grow p-4">
        <div id="mapContainer" class="hidden mb-4 bg-white p-2 border border-gray-300 rounded shadow-sm">
            <div id="mainMap"></div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-4">
            <div class="kpi-box">
                <div class="text-[10px] text-gray-500 uppercase font-bold">Ativos</div>
                <div id="kpi-ativos" class="text-xl font-bold text-green-700">0</div>
            </div>
            <div class="kpi-box">
                <div class="text-[10px] text-gray-500 uppercase font-bold">Programados</div>
                <div id="kpi-programados" class="text-xl font-bold text-yellow-600">0</div>
            </div>
            <div class="kpi-box">
                <div class="text-[10px] text-gray-500 uppercase font-bold">Saldo (t)</div>
                <div id="kpi-saldo" class="text-xl font-bold text-blue-700">0</div>
            </div>
            <div class="kpi-box">
                <div class="text-[10px] text-gray-500 uppercase font-bold">Fretes</div>
                <div id="kpi-fretes" class="text-xl font-bold text-emerald-700">R$ 0</div>
            </div>
            <div class="kpi-box">
                <div class="text-[10px] text-gray-500 uppercase font-bold">Total Itens</div>
                <div id="kpi-total" class="text-xl font-bold text-gray-700">0</div>
            </div>
        </div>

        <div class="bg-white border border-gray-300 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="spreadsheet-table">
                    <thead>
                        <tr>
                            <th>STATUS</th>
                            <th>ARMAZÉM</th>
                            <th>ORIGEM</th>
                            <th>DESTINO</th>
                            <th>PRODUTO</th>
                            <th>LOTE</th>
                            <th>SALDO (t)</th>
                            <th>FRETE (R$)</th>
                            <th>RESPONSÁVEL</th>
                            <th>LOCALIZAÇÃO</th>
                            <th width="120" class="text-center">AÇÕES</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal com Mapa de Seleção -->
    <div id="formModal" class="modal">
        <div class="bg-white border border-gray-400 shadow-2xl rounded w-full max-w-3xl mx-4 overflow-hidden">
            <div class="bg-gray-100 px-4 py-2 border-b border-gray-300 flex justify-between items-center">
                <h2 id="modalTitle" class="text-sm font-bold text-gray-700 uppercase">Dados do Embarque</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-black text-xl">&times;</button>
            </div>
            <form id="shipmentForm" onsubmit="saveShipment(event)" class="p-4">
                <div class="grid grid-cols-3 gap-4">
                    <div class="col-span-2 grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 uppercase">Status</label>
                            <select id="status" required class="w-full border border-gray-300 rounded px-2 py-1 text-sm">
                                <option value="PROGRAMADO">PROGRAMADO</option>
                                <option value="EMBARCANDO">EMBARCANDO</option>
                                <option value="FINALIZADO">FINALIZADO</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 uppercase">Armazém</label>
                            <input type="text" id="armazem" required class="w-full border border-gray-300 rounded px-2 py-1 text-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 uppercase">Origem</label>
                            <input type="text" id="origem" required class="w-full border border-gray-300 rounded px-2 py-1 text-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 uppercase">Destino</label>
                            <input type="text" id="destino" required class="w-full border border-gray-300 rounded px-2 py-1 text-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 uppercase">Produto</label>
                            <input type="text" id="produto" required class="w-full border border-gray-300 rounded px-2 py-1 text-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 uppercase">Lote</label>
                            <input type="text" id="lote" required class="w-full border border-gray-300 rounded px-2 py-1 text-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 uppercase">Saldo (t)</label>
                            <input type="number" id="saldo" required class="w-full border border-gray-300 rounded px-2 py-1 text-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 uppercase">Frete (R$)</label>
                            <input type="number" step="0.01" id="frete" required class="w-full border border-gray-300 rounded px-2 py-1 text-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 uppercase">Responsável</label>
                            <input type="text" id="responsavel" required class="w-full border border-gray-300 rounded px-2 py-1 text-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 uppercase">Telefone</label>
                            <input type="text" id="telefone" class="w-full border border-gray-300 rounded px-2 py-1 text-sm">
                        </div>
                    </div>
                    
                    <div class="col-span-1 border-l border-gray-200 pl-4">
                        <label class="block text-[10px] font-bold text-gray-500 uppercase">📍 Definir Localização</label>
                        <p class="text-[9px] text-gray-400 mb-1">Clique no mapa para marcar o local</p>
                        <div id="miniMap"></div>
                        <div class="mt-2 grid grid-cols-2 gap-2">
                            <input type="text" id="lat" placeholder="Lat" readonly class="bg-gray-50 border border-gray-300 rounded px-1 py-1 text-[10px]">
                            <input type="text" id="lng" placeholder="Lng" readonly class="bg-gray-50 border border-gray-300 rounded px-1 py-1 text-[10px]">
                        </div>
                    </div>
                </div>
                
                <input type="hidden" id="editId">
                <div class="mt-4 flex gap-2 justify-end border-t border-gray-200 pt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-1.5 border border-gray-300 rounded text-sm hover:bg-gray-50">Cancelar</button>
                    <button type="submit" class="px-4 py-1.5 bg-green-700 text-white rounded text-sm font-bold hover:bg-green-800">Gravar Dados</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let shipments = JSON.parse(localStorage.getItem('ayres_shipments_v3')) || [];
        let mainMap, miniMap, miniMarker;

        function initMaps() {
            if (!mainMap) {
                mainMap = L.map('mainMap').setView([-17.8, -51.5], 6);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mainMap);
            }
            if (!miniMap) {
                miniMap = L.map('miniMap').setView([-17.8, -51.5], 5);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(miniMap);
                miniMap.on('click', (e) => setLocation(e.latlng.lat, e.latlng.lng));
            }
        }

        function setLocation(lat, lng) {
            document.getElementById('lat').value = lat.toFixed(6);
            document.getElementById('lng').value = lng.toFixed(6);
            if (miniMarker) miniMap.removeLayer(miniMarker);
            miniMarker = L.marker([lat, lng]).addTo(miniMap);
        }

        function toggleMap() {
            const container = document.getElementById('mapContainer');
            container.classList.toggle('hidden');
            if (!container.classList.contains('hidden')) {
                initMaps();
                updateMainMarkers();
                setTimeout(() => mainMap.invalidateSize(), 100);
            }
        }

        function updateMainMarkers() {
            mainMap.eachLayer(l => { if (l instanceof L.Marker) mainMap.removeLayer(l); });
            shipments.forEach(s => {
                if (s.lat && s.lng) {
                    L.marker([s.lat, s.lng]).addTo(mainMap)
                        .bindPopup(`<b>${s.armazem}</b><br>${s.status}<br>${s.produto}`);
                }
            });
        }

        function renderTable() {
            const body = document.getElementById('tableBody');
            const search = document.getElementById('searchInput').value.toLowerCase();
            let filtered = shipments.filter(s => Object.values(s).some(v => String(v).toLowerCase().includes(search)));

            body.innerHTML = filtered.map(s => `
                <tr>
                    <td><span class="status-badge ${getStatusClass(s.status)}">${s.status}</span></td>
                    <td class="font-bold text-blue-800">${s.armazem}</td>
                    <td>${s.origem}</td>
                    <td>${s.destino}</td>
                    <td>${s.produto}</td>
                    <td>${s.lote}</td>
                    <td class="text-right font-mono">${s.saldo.toLocaleString()}</td>
                    <td class="text-right font-mono">${s.frete.toFixed(2)}</td>
                    <td>${s.responsavel}</td>
                    <td class="text-[10px] text-gray-500 italic">${s.lat ? '📍 Definida' : '❌ Não definida'}</td>
                    <td class="flex justify-center gap-2">
                        <button onclick="editShipment(${s.id})" class="text-blue-600 hover:underline text-xs">Editar</button>
                        <button onclick="deleteShipment(${s.id})" class="text-red-600 hover:underline text-xs">Excluir</button>
                    </td>
                </tr>
            `).join('');
            updateKPIs(filtered);
        }

        function getStatusClass(s) {
            return s === 'EMBARCANDO' ? 'status-embarcando' : s === 'PROGRAMADO' ? 'status-programado' : 'status-finalizado';
        }

        function updateKPIs(data) {
            document.getElementById('kpi-ativos').innerText = data.filter(s => s.status === 'EMBARCANDO').length;
            document.getElementById('kpi-programados').innerText = data.filter(s => s.status === 'PROGRAMADO').length;
            document.getElementById('kpi-saldo').innerText = data.reduce((a, b) => a + Number(b.saldo), 0).toLocaleString();
            document.getElementById('kpi-fretes').innerText = 'R$ ' + data.reduce((a, b) => a + Number(b.frete), 0).toLocaleString();
            document.getElementById('kpi-total').innerText = data.length;
        }

        function openModal(editData = null) {
            initMaps();
            document.getElementById('shipmentForm').reset();
            document.getElementById('editId').value = '';
            if (miniMarker) miniMap.removeLayer(miniMarker);
            
            if (editData) {
                document.getElementById('editId').value = editData.id;
                document.getElementById('status').value = editData.status;
                document.getElementById('armazem').value = editData.armazem;
                document.getElementById('origem').value = editData.origem;
                document.getElementById('destino').value = editData.destino;
                document.getElementById('produto').value = editData.produto;
                document.getElementById('lote').value = editData.lote;
                document.getElementById('saldo').value = editData.saldo;
                document.getElementById('frete').value = editData.frete;
                document.getElementById('responsavel').value = editData.responsavel;
                document.getElementById('telefone').value = editData.telefone;
                if (editData.lat) {
                    setLocation(editData.lat, editData.lng);
                    miniMap.setView([editData.lat, editData.lng], 8);
                }
            }
            document.getElementById('formModal').classList.add('active');
            setTimeout(() => miniMap.invalidateSize(), 200);
        }

        function closeModal() { document.getElementById('formModal').classList.remove('active'); }

        function saveShipment(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const data = {
                id: id ? Number(id) : Date.now(),
                status: document.getElementById('status').value,
                armazem: document.getElementById('armazem').value,
                origem: document.getElementById('origem').value,
                destino: document.getElementById('destino').value,
                produto: document.getElementById('produto').value,
                lote: document.getElementById('lote').value,
                saldo: Number(document.getElementById('saldo').value),
                frete: Number(document.getElementById('frete').value),
                responsavel: document.getElementById('responsavel').value,
                telefone: document.getElementById('telefone').value,
                lat: parseFloat(document.getElementById('lat').value),
                lng: parseFloat(document.getElementById('lng').value)
            };
            if (id) {
                const idx = shipments.findIndex(s => s.id === Number(id));
                shipments[idx] = data;
            } else {
                shipments.push(data);
            }
            localStorage.setItem('ayres_shipments_v3', JSON.stringify(shipments));
            renderTable();
            closeModal();
        }

        function editShipment(id) { openModal(shipments.find(s => s.id === id)); }

        function deleteShipment(id) {
            if (confirm('Excluir?')) {
                shipments = shipments.filter(s => s.id !== id);
                localStorage.setItem('ayres_shipments_v3', JSON.stringify(shipments));
                renderTable();
            }
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(shipments)], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = "backup_ayres.json"; a.click();
        }

        renderTable();
    </script>
</body>
</html>
